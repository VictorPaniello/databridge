<svg viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tidybridge: messy uploads become clean records, automatically">
  <defs>
    <style>
      .wordmark { font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; font-weight: 700; }
      .tagline { font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .pipeline { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-weight: 500; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0c0a09" />

  <!-- left: identity -->
  <text x="64" y="140" class="wordmark" font-size="60" fill="#fafaf9" letter-spacing="-1">tidy<tspan fill="#34d399">bridge</tspan></text>
  <text x="65" y="184" class="tagline" font-size="19" fill="#a8a29e">Messy uploads become clean records, automatically.</text>
  <text x="65" y="222" class="pipeline" font-size="13.5" fill="#78716c" letter-spacing="0.3">csv/excel  →  tidycsv  →  postgres  →  webhook</text>

  <!-- divider -->
  <line x1="620" y1="72" x2="620" y2="230" stroke="#292524" stroke-width="1" />

  <!-- right: the pipeline, drawn -->
  <g>
    <!-- messy rows (amber, scattered - matches the app's own "Flagged" status color) -->
    <g fill="#f59e0b">
      <circle cx="682" cy="118" r="5" />
      <circle cx="706" cy="151" r="4" />
      <circle cx="675" cy="168" r="6" />
      <circle cx="712" cy="100" r="4" />
      <circle cx="695" cy="196" r="5" />
      <circle cx="730" cy="130" r="4" />
      <circle cx="665" cy="140" r="4" />
      <circle cx="722" cy="175" r="5" />
    </g>
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="688" y1="212" x2="708" y2="216" transform="rotate(-8 698 214)" />
      <line x1="678" y1="88" x2="700" y2="92" transform="rotate(12 689 90)" />
    </g>

    <!-- the bridge -->
    <path d="M 748 150 Q 838 92 928 150" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <g stroke="#34d399" stroke-width="2" opacity="0.55">
      <line x1="790" y1="122" x2="790" y2="150" />
      <line x1="838" y1="106" x2="838" y2="150" />
      <line x1="886" y1="122" x2="886" y2="150" />
    </g>

    <!-- clean rows (emerald, aligned - matches the app's own "Clean" status color) -->
    <g fill="#34d399">
      <rect x="944" y="120" width="14" height="14" rx="3" />
      <rect x="972" y="120" width="14" height="14" rx="3" />
      <rect x="1000" y="120" width="14" height="14" rx="3" />
      <rect x="944" y="148" width="14" height="14" rx="3" />
      <rect x="972" y="148" width="14" height="14" rx="3" />
      <rect x="1000" y="148" width="14" height="14" rx="3" />
      <rect x="944" y="176" width="14" height="14" rx="3" />
      <rect x="972" y="176" width="14" height="14" rx="3" />
      <rect x="1000" y="176" width="14" height="14" rx="3" />
    </g>

    <!-- webhook notify -->
    <line x1="1024" y1="155" x2="1074" y2="155" stroke="#34d399" stroke-width="2" opacity="0.7" />
    <path d="M 1068 148 L 1078 155 L 1068 162" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    <circle cx="1100" cy="155" r="24" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.15" />
    <circle cx="1100" cy="155" r="14" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />
    <circle cx="1100" cy="155" r="5" fill="#34d399" />
  </g>
</svg>
