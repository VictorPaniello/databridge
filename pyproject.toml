[project]
name = "databridge"
version = "0.1.0"
description = "Client data ingestion service: cleans messy CSV/Excel uploads (via tidycsv), persists them to PostgreSQL, and notifies external systems via webhook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Paniello" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "tidycsv @ git+https://github.com/VictorPaniello/tidycsv.git",
    "fastapi-users[sqlalchemy]>=14.0",
    "httpx-oauth>=0.15",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databridge"]

[tool.hatch.metadata]
# Needed because tidycsv is pinned to a GitHub URL, not a PyPI release -
# intentional (it's my own project, not yet published to PyPI).
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()-as-default is the documented, idiomatic pattern - not
# a real "mutable default" bug.
"src/databridge/main.py" = ["B008"]
"src/databridge/auth_db.py" = ["B008"]
"src/databridge/auth.py" = ["B008"]
# conftest.py must set env vars before importing app modules that read them
# at import time - imports can't be at the top of the file here.
"tests/conftest.py" = ["E402"]
